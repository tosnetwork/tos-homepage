name: Vendor agent icons

on:
  push:
    branches: [official-agent-icons]
    paths:
      - '.github/workflows/vendor-agent-icons.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: official-agent-icons
      - name: Download verified first-party assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p img/agents
          curl -fL --retry 3 'https://openai.com/favicon.svg' -o img/agents/openai.svg
          curl -fL --retry 3 'https://claude.ai/images/claude_app_icon.png' -o img/agents/claude.png
          curl -fL --retry 3 'https://ptht05hbb1ssoooe.public.blob.vercel-storage.com/assets/brand/brand-logo-1.svg' -o img/agents/cursor.svg
          curl -fL --retry 3 'https://raw.githubusercontent.com/CognitionAI/devin-extension/main/assets/devin-full-color.png' -o img/agents/devin.png
          curl -fL --retry 3 'https://raw.githubusercontent.com/google-gemini/gemini-cli/main/packages/vscode-ide-companion/assets/icon.png' -o img/agents/gemini-cli.png
          curl -fL --retry 3 'https://cdn1.genspark.ai/user-upload-image/admin/brand/genspark/logos/icon-square-inverted.svg' -o img/agents/genspark.svg
          curl -fL --retry 3 'https://raw.githubusercontent.com/github/CopilotForXcode/main/Copilot%20for%20Xcode/Assets.xcassets/CopilotLogo.imageset/copilot.svg' -o img/agents/github-copilot.svg
          curl -fL --retry 3 'https://raw.githubusercontent.com/NousResearch/hermes-agent/main/apps/desktop/assets/icon.png' -o img/agents/hermes-agent.png
          curl -fL --retry 3 'https://raw.githubusercontent.com/netease-youdao/LobsterAI/main/resources/tray/tray-icon.png' -o img/agents/lobsterai.png
          curl -fL --retry 3 'https://files.manuscdn.com/assets/image/brand/image/Manus-Icon.svg' -o img/agents/manus.svg
          curl -fL --retry 3 'https://developer.qcloudimg.com/http-save/yehe-10954684/fa2ee803a3b96501a31053c7c1bfd2d6.png' -o img/agents/marvis.png
          curl -fL --retry 3 'https://raw.githubusercontent.com/openclaw/openclaw/main/ui/public/favicon.svg' -o img/agents/openclaw.svg
          curl -fL --retry 3 'https://exafunction.github.io/public/brand/windsurf-white-symbol.svg' -o img/agents/windsurf.svg
          curl -fL --retry 3 'https://dscache.tencent-cloud.cn/upload/nodir/WorkBuddy-c2692db2eb1ff11bf05def7b723c2007769255d4.png' -o img/agents/workbuddy.png
      - name: Switch homepage to local assets
        shell: python
        run: |
          from pathlib import Path
          p = Path('js/investor-home.js')
          s = p.read_text()
          replacements = {
              'https://openai.com/favicon.svg': 'img/agents/openai.svg',
              'https://claude.ai/images/claude_app_icon.png': 'img/agents/claude.png',
              'https://ptht05hbb1ssoooe.public.blob.vercel-storage.com/assets/brand/brand-logo-1.svg': 'img/agents/cursor.svg',
              'https://raw.githubusercontent.com/CognitionAI/devin-extension/main/assets/devin-full-color.png': 'img/agents/devin.png',
              'https://raw.githubusercontent.com/google-gemini/gemini-cli/main/packages/vscode-ide-companion/assets/icon.png': 'img/agents/gemini-cli.png',
              'https://cdn1.genspark.ai/user-upload-image/admin/brand/genspark/logos/icon-square-inverted.svg': 'img/agents/genspark.svg',
              'https://raw.githubusercontent.com/github/CopilotForXcode/main/Copilot%20for%20Xcode/Assets.xcassets/CopilotLogo.imageset/copilot.svg': 'img/agents/github-copilot.svg',
              'https://raw.githubusercontent.com/NousResearch/hermes-agent/main/apps/desktop/assets/icon.png': 'img/agents/hermes-agent.png',
              'https://raw.githubusercontent.com/netease-youdao/LobsterAI/main/resources/tray/tray-icon.png': 'img/agents/lobsterai.png',
              'https://files.manuscdn.com/assets/image/brand/image/Manus-Icon.svg': 'img/agents/manus.svg',
              'https://developer.qcloudimg.com/http-save/yehe-10954684/fa2ee803a3b96501a31053c7c1bfd2d6.png': 'img/agents/marvis.png',
              'https://raw.githubusercontent.com/openclaw/openclaw/main/ui/public/favicon.svg': 'img/agents/openclaw.svg',
              'https://exafunction.github.io/public/brand/windsurf-white-symbol.svg': 'img/agents/windsurf.svg',
              'https://dscache.tencent-cloud.cn/upload/nodir/WorkBuddy-c2692db2eb1ff11bf05def7b723c2007769255d4.png': 'img/agents/workbuddy.png',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
      - name: Record provenance
        shell: bash
        run: |
          cat > img/agents/SOURCES.md <<'EOF'
          # Agent icon sources

          All files in this directory are vendored copies of first-party product assets. They are served locally by tos.network; no runtime hotlink is required.

          - `openai.svg` — OpenAI: `https://openai.com/favicon.svg` (used for ChatGPT Agent and Codex pending distinct product-specific marks)
          - `claude.png` — Anthropic Claude: `https://claude.ai/images/claude_app_icon.png`
          - `cursor.svg` — Cursor official brand asset CDN
          - `devin.png` — CognitionAI official `devin-extension` repository, `assets/devin-full-color.png`
          - `gemini-cli.png` — Google Gemini CLI official repository
          - `genspark.svg` — Genspark official CDN
          - `github-copilot.svg` — GitHub official `CopilotForXcode` repository
          - `hermes-agent.png` — Nous Research official `hermes-agent` repository
          - `lobsterai.png` — NetEase Youdao official `LobsterAI` repository
          - `manus.svg` — Manus official CDN
          - `marvis.png` — Tencent-hosted Marvis asset
          - `openclaw.svg` — OpenClaw official repository
          - `windsurf.svg` — Windsurf/Exafunction official brand asset host
          - `workbuddy.png` — Tencent-hosted WorkBuddy asset

          Do not redraw, recolor, or substitute these marks with third-party logo-library versions.
          EOF
      - name: Remove one-time workflow and commit vendored assets
        shell: bash
        run: |
          rm -f .github/workflows/vendor-agent-icons.yml
          git config user.name 'tosnetwork-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add img/agents js/investor-home.js .github/workflows/vendor-agent-icons.yml
          git commit -m 'Vendor official agent icons locally'
          git push origin HEAD:official-agent-icons
